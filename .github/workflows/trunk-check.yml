name: Trunk Code Quality

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full-repo check (UTC)
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@v1
        with:
          # Hold-the-line on push/PR; full repo on schedule / manual dispatch.
          # Do not set post-annotations here — that path expects a workflow_run
          # event and fails with SyntaxError on push/PR jobs.
          check-mode: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'all' || '' }}
