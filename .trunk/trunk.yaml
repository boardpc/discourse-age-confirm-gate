# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
    - ruby@3.4.2
    - node@22.16.0
lint:
  enabled:
    - checkov@3.4.11
    - eslint@10.15.0
    - grype@0.122.1
    - osv-scanner@2.7.1
    - pinact@5.0.2
    - rubocop@1.39.0
    - stylelint@18.1.0
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.50.1
    - prettier@3.10.1
    - taplo@0.10.0
    - trufflehog@3.100.1
    - yamllint@1.38.0
  ignore:
    - linters: [prettier]
      paths:
        - pnpm-lock.yaml
        - Gemfile.lock
    - linters: [markdownlint]
      paths:
        - CHANGELOG.md
actions:
  enabled:
    - commitlint
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
repo:
  trunk_branch: develop
