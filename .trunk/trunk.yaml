# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
    - ruby@3.4.2
    - node@22.16.0
lint:
  enabled:
    - checkov@3.4.11
    - grype@0.122.1
    - osv-scanner@2.7.1
    - actionlint@1.7.12
    - git-diff-check
    # 0.50.1 needs Node >=22.22.2; keep 0.50.0 until Trunk ships a newer Node runtime
    - markdownlint@0.50.0
    - prettier@3.10.1
    - taplo@0.10.0
    - trufflehog@3.100.1
    - yamllint@1.38.0
  disabled:
    # Discourse plugin CI owns JS/Ruby/CSS lint via @discourse/lint-configs + rubocop-discourse
    - eslint
    - rubocop
    - stylelint
    # pinact v5 breaks Trunk's -format flag; re-enable when plugins catch up
    - pinact
  ignore:
    - linters: [prettier]
      paths:
        - pnpm-lock.yaml
        - Gemfile.lock
    - linters: [markdownlint]
      paths:
        - CHANGELOG.md
    # Lockfiles track Discourse lint-stack transitive deps; we don't vendor app runtimes here
    - linters: [osv-scanner, grype]
      paths:
        - pnpm-lock.yaml
        - Gemfile.lock
    - linters: [yamllint]
      paths:
        - pnpm-lock.yaml
actions:
  enabled:
    - commitlint
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
repo:
  trunk_branch: develop
