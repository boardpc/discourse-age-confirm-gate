en:
  site_settings:
    age_confirm_gate_enabled: Enable the age confirmation gate for NSFW topics and categories
    age_confirm_gate_min_age: Minimum age that users must confirm to view NSFW content
    age_confirm_gate_blocked_message: >-
      Message shown when NSFW content is blocked. Reset restores the default message.
    age_confirm_gate_topic_visibility: How NSFW topics appear for non-compliant users
    age_confirm_gate_require_reconfirm_on_threshold_raise: >-
      Require users to reconfirm when the minimum age setting is raised
    age_confirm_gate_staff_verification_required: >-
      Only staff may set a user's age confirmation status (self-confirm disabled)
    age_confirm_gate_block_guests: Block anonymous guests from NSFW content
    age_confirm_gate_guests_see_titles: >-
      When guests are blocked, still show NSFW titles and the blocked banner
  age_confirm_gate:
    default_blocked_message: You must confirm that you are %{min_age}+ to view this content.
