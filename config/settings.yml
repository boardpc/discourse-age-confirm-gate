discourse_age_confirm_gate:
  age_confirm_gate_enabled:
    default: true
    client: true
  age_confirm_gate_min_age:
    default: 18
    client: true
    type: enum
    choices:
      - 16
      - 18
      - 21
  age_confirm_gate_blocked_message:
    default: You must confirm that you are 18+ to view this content.
    locale_default:
      pl_PL: Musisz potwierdzić, że masz 18+ lat, aby zobaczyć tę treść.
    client: true
  age_confirm_gate_topic_visibility:
    default: show_with_banner
    client: true
    type: enum
    choices:
      - show_with_banner
      - hide_entirely
  age_confirm_gate_require_reconfirm_on_threshold_raise:
    default: true
    client: true
  age_confirm_gate_staff_verification_required:
    default: false
    client: true
  age_confirm_gate_always_allow_groups:
    default: ""
    type: group_list
    list_type: compact
    allow_any: false
    client: true
  age_confirm_gate_block_guests:
    default: true
    client: true
  age_confirm_gate_guests_see_titles:
    default: false
    client: true
